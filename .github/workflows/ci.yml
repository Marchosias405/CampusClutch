name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Check server, browser and native auth initialization
        run: npm run test:auth-runtime

      - name: Check offer action lifecycle
        run: npm run test:offers-lifecycle

      - name: Check direct and group messaging client contracts
        run: npm run test:messages-client

      - name: Check messaging state and navigation boundaries
        run: npm run test:messages-ui

      - name: Check realtime lifecycle and session isolation
        run: npm run test:messages-realtime

      - name: Check course catalog import, search and upcoming enrollment
        run: npm run test:catalog
