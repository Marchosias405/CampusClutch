<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="__CSP__">
  <title>Reset password · Clu</title>
  <link rel="stylesheet" href="recovery.css">
  <script src="recovery.js" defer></script>
</head>
<body>
  <header>Clu</header>
  <main>
    <p class="eyebrow">Account recovery</p>
    <h1 id="title">Reset your password</h1>
    <p id="status" role="status" aria-live="polite">Checking your reset link…</p>
    <form id="form" hidden novalidate>
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="hint">
      <p id="hint" class="hint">Use at least 8 characters.</p>
      <label for="confirm">Confirm new password</label>
      <input id="confirm" type="password" autocomplete="new-password" maxlength="128" required>
      <p id="error" role="alert"></p>
      <button id="submit" type="submit">Save new password</button>
    </form>
    <button id="retry-signout" type="button" hidden>Retry sign-out</button>
    <p id="help">You can reset your password here on any device. Then return to the app to sign in.</p>
    <noscript>Enable JavaScript in your browser, then open the reset link again.</noscript>
  </main>
</body>
</html>
